[options]
directory = /home/soramimi/develop/behind
allow-client = 0.0.0.0/0
allow-client = ::/0
listen = 0.0.0.0@5301
listen = ::@5301

;max-tasks = 200
;rate-limit-qps = 5000
;rate-limit-burst = 5000

max-tasks = 10000
rate-limit-qps = 100000
rate-limit-burst = 100000

upstream-timeout-ms = 1000

udp-multiple-forwarding = 2

[logging]
file = /var/log/behind/behind.log
;file = /tmp/behind.log

[forward-zone]
forward-addr = 2001:4860:4860::8888
forward-addr = 2001:4860:4860::8844
forward-addr = 2606:4700:4700::1111
forward-addr = 2606:4700:4700::1001
forward-addr = 2620:fe::10
forward-addr = 2620:fe::fe:10
forward-addr = 2620:119:35::35
forward-addr = 2620:119:53::53
forward-addr = 2a07:a8c0::
forward-addr = 2a07:a8c1::
;forward-addr = 2a10:50c0::ad1:ff
;forward-addr = 2a10:50c0::ad2:ff
;forward-addr = 8.8.8.8
;forward-addr = 1.1.1.1

[forward-zone "lan"]
forward-addr = 10.168.0.1

[filter]
include nxdomain.conf
nxdomain = pixel.*
nxdomain = sync.*
nxdomain = ads.*
nxdomain = *html-load*
nxdomain = *content-loader*
nxdomain = *tron.jiyunhudong.com*
nxdomain = *polyfill.*
nxdomain = *.lan

[hosts "lan"]
;"printer1" = 192.168.0.230
;"archlinux" = 10.168.0.80
;"app" = 10.168.0.80
;file = hosts.lan

